server:
  port: 8081

spring:
  application:
    name: service
  datasource:
    url: jdbc:postgresql://localhost:5432/wearminutes_db
    username: postgres
    password: secretpassword
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:alokd1512@gmail.com}
    password: ${MAIL_PASSWORD:konf dsee kgeq svrx}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.type.mapping: orderEvent:com.wearminutes.service.event.OrderPlacedEvent,deliveryTaskEvent:com.wearminutes.service.event.DeliveryTaskEvent
    consumer:
      group-id: vendor-notify
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.type.mapping: orderEvent:com.wearminutes.service.event.OrderPlacedEvent,deliveryTaskEvent:com.wearminutes.service.event.DeliveryTaskEvent
        spring.json.value.default.type: com.wearminutes.service.event.OrderPlacedEvent
        spring.json.trusted.packages: "*"
    admin:
      auto-create: true